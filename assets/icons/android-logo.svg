<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="androidGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DDC84"/>
      <stop offset="100%" stop-color="#00BA66"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#3DDC84" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Antennae -->
  <line x1="32" y1="28" x2="22" y2="14" stroke="url(#androidGreenGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="68" y1="28" x2="78" y2="14" stroke="url(#androidGreenGrad)" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Head dome -->
  <path d="M 20 48 A 30 30 0 0 1 80 48 Z" fill="url(#androidGreenGrad)" filter="url(#glow)"/>
  
  <!-- Eyes -->
  <circle cx="38" cy="38" r="3.8" fill="#0A0F1D"/>
  <circle cx="62" cy="38" r="3.8" fill="#0A0F1D"/>
</svg>
