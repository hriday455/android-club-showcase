<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <radialGradient id="greenGlow" cx="50%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#3DDC84" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#3DDC84" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0A0F1D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="80%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.09"/>
      <stop offset="60%" stop-color="#0A0F1D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="20%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#0A0F1D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
      <circle cx="60" cy="0" r="1.5" fill="rgba(61, 220, 132, 0.25)"/>
    </pattern>
    <pattern id="dotPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255, 255, 255, 0.04)"/>
    </pattern>
  </defs>

  <!-- Ambient Light Orbs -->
  <rect width="1440" height="900" fill="url(#greenGlow)"/>
  <rect width="1440" height="900" fill="url(#cyanGlow)"/>
  <rect width="1440" height="900" fill="url(#purpleGlow)"/>

  <!-- Subtle Matrix Grids -->
  <rect width="1440" height="900" fill="url(#gridPattern)"/>
  <rect width="1440" height="900" fill="url(#dotPattern)" opacity="0.6"/>

  <!-- High-Tech Circuit Traces -->
  <g stroke="rgba(61, 220, 132, 0.12)" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M 0 250 L 320 250 L 380 310 L 650 310"/>
    <circle cx="380" cy="310" r="3" fill="#3DDC84" fill-opacity="0.4"/>
    <circle cx="650" cy="310" r="4" fill="#3DDC84" fill-opacity="0.6"/>

    <path d="M 800 120 L 980 120 L 1040 180 L 1440 180"/>
    <circle cx="980" cy="120" r="3" fill="#38BDF8" fill-opacity="0.4"/>

    <path d="M 1200 600 L 1300 700 L 1440 700"/>
    <path d="M 100 750 L 250 750 L 310 690 L 500 690"/>
    <circle cx="310" cy="690" r="3" fill="#A855F7" fill-opacity="0.4"/>
  </g>
</svg>
