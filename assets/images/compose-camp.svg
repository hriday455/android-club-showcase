<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022B22"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#021E36"/>
    </linearGradient>
    <linearGradient id="androidGreen2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3DDC84"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
  </defs>

  <rect width="600" height="320" rx="16" fill="url(#compGrad)"/>

  <!-- Tech Circles -->
  <circle cx="500" cy="80" r="120" fill="#3DDC84" fill-opacity="0.05"/>
  <circle cx="100" cy="240" r="90" fill="#38BDF8" fill-opacity="0.05"/>

  <!-- Logo and Badge -->
  <g transform="translate(40, 40)">
    <rect width="110" height="28" rx="14" fill="rgba(61, 220, 132, 0.15)" stroke="rgba(61, 220, 132, 0.4)"/>
    <text x="55" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#3DDC84">WORKSHOP</text>

    <text x="0" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#F8FAFC">Compose Camp 2026</text>
    <text x="0" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#94A3B8">Zero to Hero in Declarative Android UI</text>

    <!-- Details list -->
    <g transform="translate(0, 140)" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#E2E8F0">
      <circle cx="8" cy="8" r="4" fill="#3DDC84"/>
      <text x="24" y="12">Hands-on code labs with Google Developer Experts</text>

      <circle cx="8" cy="38" r="4" fill="#38BDF8"/>
      <text x="24" y="42">Build 3 real apps: Material 3, Animations &amp; StateFlow</text>

      <circle cx="8" cy="68" r="4" fill="#A855F7"/>
      <text x="24" y="72">Certificates of completion + Google Swag Bags</text>
    </g>
  </g>

  <!-- Code snippet badge on the right -->
  <g transform="translate(370, 70)">
    <rect width="190" height="170" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(61, 220, 132, 0.3)"/>
    <text x="15" y="28" font-family="'Fira Code', monospace" font-size="10" fill="#3DDC84">@Composable</text>
    <text x="15" y="48" font-family="'Fira Code', monospace" font-size="10" fill="#F8FAFC">fun AndroidClubApp() {</text>
    <text x="25" y="68" font-family="'Fira Code', monospace" font-size="10" fill="#38BDF8">  Scaffold(</text>
    <text x="35" y="88" font-family="'Fira Code', monospace" font-size="10" fill="#94A3B8">    topBar = { ... },</text>
    <text x="35" y="108" font-family="'Fira Code', monospace" font-size="10" fill="#E2E8F0">    content = {</text>
    <text x="45" y="128" font-family="'Fira Code', monospace" font-size="10" fill="#F43F5E">      LearnCompose()</text>
    <text x="35" y="148" font-family="'Fira Code', monospace" font-size="10" fill="#E2E8F0">    }</text>
    <text x="15" y="162" font-family="'Fira Code', monospace" font-size="10" fill="#F8FAFC">  )</text>
  </g>
</svg>
