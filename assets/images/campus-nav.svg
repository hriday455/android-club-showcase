<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1329"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="neonGreen1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3DDC84"/>
      <stop offset="100%" stop-color="#00F59B"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" rx="16" fill="url(#bgGrad1)"/>
  
  <!-- Subtle Grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="380"/>
    <line x1="150" y1="0" x2="150" y2="380"/>
    <line x1="250" y1="0" x2="250" y2="380"/>
    <line x1="350" y1="0" x2="350" y2="380"/>
    <line x1="450" y1="0" x2="450" y2="380"/>
    <line x1="550" y1="0" x2="550" y2="380"/>
    <line x1="0" y1="70" x2="600" y2="70"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="230" x2="600" y2="230"/>
    <line x1="0" y1="310" x2="600" y2="310"/>
  </g>

  <!-- Map Graphical Representation -->
  <g transform="translate(40, 40)">
    <!-- Map Path Lines -->
    <path d="M 60 180 Q 150 90, 240 140 T 380 70 T 480 120" fill="none" stroke="rgba(61, 220, 132, 0.2)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 60 180 Q 150 90, 240 140 T 380 70 T 480 120" fill="none" stroke="url(#neonGreen1)" stroke-width="4" stroke-dasharray="6,4"/>

    <!-- Map Nodes / Landmarks -->
    <circle cx="60" cy="180" r="10" fill="#3DDC84" filter="url(#cardShadow)"/>
    <circle cx="60" cy="180" r="4" fill="#0B1329"/>
    
    <circle cx="240" cy="140" r="8" fill="#38BDF8"/>
    <circle cx="380" cy="70" r="8" fill="#A855F7"/>
    
    <circle cx="480" cy="120" r="14" fill="#EF4444" filter="url(#cardShadow)"/>
    <circle cx="480" cy="120" r="6" fill="#FFF"/>

    <!-- UI Overlay Card (Phone Mock preview) -->
    <g transform="translate(140, 70)" filter="url(#cardShadow)">
      <rect width="240" height="180" rx="14" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(61, 220, 132, 0.4)" stroke-width="1.5"/>
      <!-- App Header -->
      <rect x="15" y="15" width="28" height="28" rx="8" fill="#3DDC84"/>
      <path d="M 22 29 L 29 20 L 36 29 Z" fill="#0A0F1D"/>
      <text x="52" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">CampusNav 3D</text>
      <text x="52" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94A3B8">Auditorium → Library (3 mins)</text>
      
      <!-- Direction Card -->
      <rect x="15" y="55" width="210" height="42" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
      <circle cx="35" cy="76" r="10" fill="#3DDC84" fill-opacity="0.2"/>
      <path d="M 32 76 L 38 72 L 38 80 Z" fill="#3DDC84"/>
      <text x="52" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#F8FAFC">Turn right at Tech Block C</text>
      <text x="52" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#3DDC84">In 45 meters • AR Mode Active</text>

      <!-- Live Stats Pills -->
      <rect x="15" y="108" width="65" height="24" rx="12" fill="rgba(56, 189, 248, 0.15)"/>
      <text x="25" y="124" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#38BDF8">Indoor GPS</text>

      <rect x="85" y="108" width="75" height="24" rx="12" fill="rgba(61, 220, 132, 0.15)"/>
      <text x="95" y="124" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#3DDC84">AR Core v1.4</text>

      <rect x="165" y="108" width="60" height="24" rx="12" fill="rgba(168, 85, 247, 0.15)"/>
      <text x="175" y="124" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#C084FC">Offline Map</text>

      <!-- Progress bar -->
      <rect x="15" y="145" width="210" height="6" rx="3" fill="#334155"/>
      <rect x="15" y="145" width="140" height="6" rx="3" fill="url(#neonGreen1)"/>
      <text x="15" y="166" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94A3B8">Arriving at 10:45 AM (85% on time)</text>
    </g>
  </g>
</svg>
